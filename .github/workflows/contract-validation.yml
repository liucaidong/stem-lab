name: Contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/**"
      - "docs/architecture/**"
      - "contracts/README.md"
      - "requirements-contract-validation.txt"
      - "requirements-contract-validation.lock.txt"
      - ".github/workflows/contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/**"
      - "docs/architecture/**"
      - "contracts/README.md"
      - "requirements-contract-validation.txt"
      - "requirements-contract-validation.lock.txt"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stemlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stemlab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contract-validation.lock.txt
      - name: Install pinned validators
        run: python -m pip install -r requirements-contract-validation.lock.txt
      - name: Validate draft contracts and reference cases
        run: python scripts/validate_contracts.py

      - name: Validate Package Ingestion Job schema
        run: python scripts/validate_ingestion_job_contract.py
      - name: Validate Scientific Expression AST and Quantity typing
        run: python scripts/validate_expression_ast.py

      - name: Validate Package Resource Graph and dependency closure
        run: python scripts/validate_package_resource_graph.py

      - name: Validate canonical manifest serialization candidates
        run: python scripts/validate_package_canonical_manifest.py

      - name: Set up Node.js for independent canonicalization vectors
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify canonicalization golden vectors independently in Node.js
        run: node scripts/verify_package_canonicalization_golden_vectors.mjs

      - name: Validate Package source and resource content integrity fixtures
        run: python scripts/validate_package_content_integrity.py

      - name: Test safe in-memory Package archive ingestion boundary
        run: python scripts/test_package_archive_ingestion.py

      - name: Validate Package ingestion lifecycle and idempotency contract
        run: python scripts/validate_package_ingestion_lifecycle.py

      - name: Test Package ingestion PostgreSQL transaction, RLS, and Outbox integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_package_ingestion_postgres.py

      - name: Validate Package signature, provenance, and license governance
        run: python scripts/validate_package_governance.py

      - name: Validate Runtime Event Registry and compatibility policy
        run: python scripts/validate_event_registry.py

      - name: Run SQLite Event Inbox Outbox Replay integration harness
        run: python scripts/test_event_delivery_sqlite.py

      - name: Validate PostgreSQL transaction, RLS, Inbox, and Outbox integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_postgres_transaction_rls.py

      - name: Test Package ingestion worker lease, fencing, retry and DLQ on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_package_ingestion_worker_postgres.py

      - name: Validate API security and operational semantics
        run: python scripts/validate_api_operational_semantics.py

      - name: Validate Simulation Runtime execution contract
        run: python scripts/validate_runtime_execution_contract.py

      - name: Run DC and RC numerical solver verification reference harness
        run: python scripts/test_solver_numerical_reference.py

      - name: Validate Visualization, Scene Graph, Timeline, and Instrument contracts
        run: python scripts/validate_visualization_instrument_contract.py

      - name: Run cross-module Engineering Integration Audit
        run: python scripts/validate_integration_audit.py
