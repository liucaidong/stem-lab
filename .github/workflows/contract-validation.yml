name: Contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/validate_contracts.py"
      - "requirements-contract-validation.txt"
      - ".github/workflows/contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/validate_contracts.py"
      - "requirements-contract-validation.txt"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contract-validation.txt
      - name: Install pinned validators
        run: python -m pip install -r requirements-contract-validation.txt
      - name: Validate draft contracts and reference cases
        run: python scripts/validate_contracts.py
