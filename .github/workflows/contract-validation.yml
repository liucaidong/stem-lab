name: Contract validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "contracts/**"
      - "sql/**"
      - "scripts/**"
      - "runtime/**"
      - "docs/architecture/**"
      - "contracts/README.md"
      - "requirements-contract-validation.txt"
      - "requirements-contract-validation.lock.txt"
      - ".github/workflows/contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "sql/**"
      - "scripts/**"
      - "runtime/**"
      - "docs/architecture/**"
      - "contracts/README.md"
      - "requirements-contract-validation.txt"
      - "requirements-contract-validation.lock.txt"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

concurrency:
  group: stem-lab-global-ci
  cancel-in-progress: false
  queue: single

permissions: {}

jobs:
  ci-admission:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify CI admission policy and cooldown boundary tests
        run: |
          python scripts/validate_ci_workflow_policy.py
          python scripts/test_ci_admission.py
          python scripts/test_ci_result.py
          python scripts/test_ci_workflow_policy.py
      - name: Enforce repository-wide 300-second CI admission gate
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python scripts/ci_admission.py
      - name: Persist repository-wide admission marker
        if: steps.admission.outputs.admitted == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stem-lab-ci-admission
          path: .ci-admission/marker.json
          if-no-files-found: error
          retention-days: 1

  validate-contracts:
    permissions:
      contents: read
    needs: ci-admission
    if: needs.ci-admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:0b81cec82228160abfa753aeaad0609b709eb26eeb950f2e404ad2326e1cc370
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stemlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stemlab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contract-validation.lock.txt
      - name: Install pinned validators
        run: python -m pip install --require-hashes -r requirements-contract-validation.lock.txt
      - name: Validate draft contracts and reference cases
        run: python scripts/validate_contracts.py

      - name: Validate Package Ingestion Job schema
        run: python scripts/validate_ingestion_job_contract.py
      - name: Validate Scientific Expression AST and Quantity typing
        run: python scripts/validate_expression_ast.py

      - name: Validate Package Resource Graph and dependency closure
        run: python scripts/validate_package_resource_graph.py

      - name: Validate canonical manifest serialization candidates
        run: python scripts/validate_package_canonical_manifest.py

      - name: Set up Node.js for independent canonicalization vectors
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"

      - name: Verify canonicalization golden vectors independently in Node.js
        run: node scripts/verify_package_canonicalization_golden_vectors.mjs

      - name: Validate Package source and resource content integrity fixtures
        run: python scripts/validate_package_content_integrity.py

      - name: Test safe in-memory Package archive ingestion boundary
        run: python scripts/test_package_archive_ingestion.py

      - name: Validate Package ingestion lifecycle and idempotency contract
        run: python scripts/validate_package_ingestion_lifecycle.py

      - name: Test Package ingestion PostgreSQL transaction, RLS, and Outbox integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_package_ingestion_postgres.py

      - name: Validate Package signature, provenance, and license governance
        run: python scripts/validate_package_governance.py

      - name: Validate Runtime Event Registry and compatibility policy
        run: python scripts/validate_event_registry.py

      - name: Run SQLite Event Inbox Outbox Replay integration harness
        run: python scripts/test_event_delivery_sqlite.py

      - name: Validate PostgreSQL transaction, RLS, Inbox, and Outbox integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_postgres_transaction_rls.py

      - name: Test Package ingestion worker lease, fencing, retry and DLQ on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_package_ingestion_worker_postgres.py

      - name: Test adapter-neutral Worker Runtime lifecycle and supervision reference
        run: python scripts/test_worker_runtime.py

      - name: Test bounded Worker poller pool and concurrency supervision reference
        run: python scripts/test_worker_pool.py

      - name: Test process signal and graceful shutdown bridge reference
        run: python scripts/test_process_lifecycle.py

      - name: Validate Worker Retry Policy Registry
        run: python scripts/validate_worker_retry_policy.py

      - name: Test Worker Retry Policy evaluation
        run: python scripts/test_worker_retry_policy.py

      - name: Validate DLQ Replay Plan contract
        run: python scripts/validate_dlq_replay.py

      - name: Test DLQ Replay authorization preflight
        run: python scripts/test_dlq_replay.py

      - name: Test tenant assertion verifier reference contract
        run: python scripts/test_tenant_context.py

      - name: Test PostgreSQL tenant RLS trust boundary and GUC spoofability
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_tenant_rls_trust_boundary_postgres.py

      - name: Test PostgreSQL-side tenant assertion verifier and privilege boundary
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_postgres_tenant_assertion_verifier.py

      - name: Test language-neutral Worker Store and Unit of Work contract
        run: python scripts/test_store_protocol_contract.py

      - name: Validate API security and operational semantics
        run: python scripts/validate_api_operational_semantics.py

      - name: Validate Simulation Runtime execution contract
        run: python scripts/validate_runtime_execution_contract.py

      - name: Run DC and RC numerical solver verification reference harness
        run: python scripts/test_solver_numerical_reference.py

      - name: Validate Visualization, Scene Graph, Timeline, and Instrument contracts
        run: python scripts/validate_visualization_instrument_contract.py

      - name: Run cross-module Engineering Integration Audit
        run: python scripts/validate_integration_audit.py

  tenant-ed25519-verifier:
    permissions:
      contents: read
    needs: ci-admission
    if: needs.ci-admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned PostgreSQL client driver
        run: python -m pip install --require-hashes -r requirements-contract-validation.lock.txt
      - name: Build PostgreSQL 17.11 with pinned pgsodium
        run: docker build --pull -f scripts/docker/pgsodium-postgres17.Dockerfile -t stemlab-postgres17-pgsodium:3.1.11 .
      - name: Start PostgreSQL with pgsodium
        run: docker run -d --name stemlab-pgsodium -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=stemlab_test -p 5432:5432 stemlab-postgres17-pgsodium:3.1.11
      - name: Wait for PostgreSQL health
        run: |
          for attempt in $(seq 1 60); do
            if docker exec stemlab-pgsodium pg_isready -U postgres -d stemlab_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs stemlab-pgsodium
          exit 1
      - name: Test Ed25519 database-side tenant assertion verifier
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
        run: python scripts/test_postgres_tenant_ed25519_verifier.py
      - name: Set up Node.js for node-postgres benchmark
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "24"
      - name: Install node-postgres benchmark dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/benchmarks/store-driver-node
      - name: Run Store driver and pool smoke benchmark
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stemlab_test
          STORE_BENCH_ENV_FILE: ${{ runner.temp }}/store-bench-env.json
          STORE_BENCH_NODE_OUTPUT: ${{ runner.temp }}/store-bench-node.json
          STORE_BENCH_OUTPUT: ${{ runner.temp }}/store-bench-results.json
        run: python scripts/benchmark_store_driver_pool.py
      - name: Upload Store driver benchmark smoke results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: store-driver-pool-benchmark-smoke
          path: ${{ runner.temp }}/store-bench-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Print PostgreSQL verifier container logs
        if: always()
        run: docker logs stemlab-pgsodium || true
      - name: Remove PostgreSQL verifier container
        if: always()
        run: docker rm -f stemlab-pgsodium || true

  ci-result:
    permissions:
      contents: read
    name: CI result
    if: always()
    needs:
      - ci-admission
      - validate-contracts
      - tenant-ed25519-verifier
    runs-on: ubuntu-latest
    env:
      CI_ADMISSION_RESULT: ${{ needs.ci-admission.result }}
      CI_ADMITTED: ${{ needs.ci-admission.outputs.admitted }}
      CI_VALIDATE_CONTRACTS_RESULT: ${{ needs.validate-contracts.result }}
      CI_TENANT_ED25519_RESULT: ${{ needs.tenant-ed25519-verifier.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce truthful final CI status
        run: python scripts/ci_result.py