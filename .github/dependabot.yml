version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/scripts/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts/benchmarks/store-driver-node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      node-minor-patch:
        update-types: ["minor", "patch"]