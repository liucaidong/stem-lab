version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/scripts/docker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts/benchmarks/store-driver-node"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      node-minor-patch:
        update-types: ["minor", "patch"]
